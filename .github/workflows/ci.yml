name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Floor is provisional until AI Makerspace prerequisites are verified.
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (no uv required to run the tool itself)
        run: python -m pip install -e . pytest
      - name: Smoke test entry points
        run: |
          python-doctor --help
          python -m python_doctor --version
      - name: Test
        run: python -m pytest -v
